<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Project Manager{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="nav">
    <strong>Project Manager</strong>
    <a href="{{ url_for('projects.project_list') }}">Projects</a>
    <a href="{{ url_for('projects.task_list') }}">Tasks</a>
    <a href="{{ url_for('projects.project_create') }}">New Project</a>
    <a href="{{ url_for('projects.task_create') }}">New Task</a>
  </nav>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
